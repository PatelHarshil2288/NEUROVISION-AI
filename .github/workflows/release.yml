name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller neurovision.spec --clean --noconfirm

      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NeurovisionAI.exe -DestinationPath NeurovisionAI-Windows.zip
          Get-FileHash NeurovisionAI-Windows.zip -Algorithm SHA256 |
            Select-Object -Property @{Name="sha256";Expression={$_.Hash.ToLower()}},Path |
            ConvertTo-Json |
            Set-Content NeurovisionAI-Windows.zip.sha256.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            NeurovisionAI-Windows.zip
            NeurovisionAI-Windows.zip.sha256.json
