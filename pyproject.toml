[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-ai"
version = "0.1.3"
description = "Interactive Neural Intelligence Laboratory (local-first)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patel Harshil"}]
requires-python = ">=3.12"
keywords = ["mnist", "neural-network", "pytorch", "visualization", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "PySide6",
    "torch",
    "torchvision",
    "PyOpenGL",
]

[project.scripts]
neurovision = "neurovision.app.main:main"

[project.urls]
Homepage = "https://github.com/PatelHarshil2288/NEUROVISION-AI"
Repository = "https://github.com/PatelHarshil2288/NEUROVISION-AI"
Issues = "https://github.com/PatelHarshil2288/NEUROVISION-AI/issues"
Changelog = "https://github.com/PatelHarshil2288/NEUROVISION-AI/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
