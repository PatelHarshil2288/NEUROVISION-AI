[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-ai-backend"
version = "0.1.0"
description = "FastAPI and PyTorch foundation for the NEUROVISION AI web platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26",
    "Pillow>=10",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "torchvision>=0.19",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
neurovision-train-mnist = "neurovision_api.scripts.train_mnist:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
