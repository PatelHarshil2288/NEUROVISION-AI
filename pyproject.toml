[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-ai"
version = "0.1.1"
description = "Interactive Neural Intelligence Laboratory (local-first)."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "PySide6",
    "torch",
    "torchvision",
    "PyOpenGL",
]

[project.scripts]
neurovision = "neurovision.app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
